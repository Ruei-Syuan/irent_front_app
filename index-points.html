<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜點數紀錄</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body" data-initial-page="points">
    <main data-app-loading role="status">頁面載入中…</main>
    <template data-page-content="points">
      <section
        class="feature-view points-view"
        data-view-panel="points"
        aria-label="點數紀錄"
      >
        <header class="feature-view__header">
          <span>點數紀錄</span><strong>查看你的回饋與會員點數</strong>
        </header>
        <article class="points-balance-card">
          <div>
            <span>目前可用點數</span><strong>8<small> 點</small></strong>
          </div>
          <span class="points-balance-card__icon">✦</span>
          <p>完成良好用車與回饋，可累積更多點數。</p>
        </article>
        <section class="points-record-card">
          <header>
            <div><strong>過去違規紀錄</strong><small>造成扣點的使用紀錄</small></div>
            <span>共 2 筆</span>
          </header>
          <div class="points-record-list">
            <article>
              <span class="points-record-icon points-record-icon--warning">!</span>
              <div>
                <strong>車內遺留大型垃圾</strong><small>2026/07/21・還車檢查</small>
              </div>
              <b class="points-value points-value--negative">-1 點</b>
            </article>
            <article>
              <span class="points-record-icon points-record-icon--warning">!</span>
              <div>
                <strong>未依規定完成車況回報</strong
                ><small>2026/06/25・行程結束</small>
              </div>
              <b class="points-value points-value--negative">-2 點</b>
            </article>
          </div>
        </section>
        <section class="points-record-card">
          <header>
            <div>
              <strong>獲得點數紀錄</strong><small>完成任務與回饋所得點數</small>
            </div>
            <span>共 3 筆</span>
          </header>
          <div class="points-record-list">
            <article>
              <span class="points-record-icon points-record-icon--success">✓</span>
              <div>
                <strong>完成車況回饋</strong><small>2026/07/21・回饋任務</small>
              </div>
              <b class="points-value points-value--positive">+1 點</b>
            </article>
            <article>
              <span class="points-record-icon points-record-icon--success">✓</span>
              <div>
                <strong>完成首次租車檢查</strong><small>2026/05/20・新手任務</small>
              </div>
              <b class="points-value points-value--positive">+5 點</b>
            </article>
            <article>
              <span class="points-record-icon points-record-icon--success">✓</span>
              <div>
                <strong>連續三次準時還車</strong><small>2026/04/30・會員獎勵</small>
              </div>
              <b class="points-value points-value--positive">+4 點</b>
            </article>
          </div>
        </section>
      </section>
    </template>
    <noscript>請啟用 JavaScript 以使用 iRent。</noscript>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
