<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜iRent</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body" data-initial-page="return/choice">
    <main data-app-loading role="status">頁面載入中…</main>
    <template data-page-content="return/choice">
      <section class="return-screen is-active" data-return-screen="choice">
        <header class="return-topbar">
          <a class="return-wordmark" href="index.html" aria-label="iRent">iRent</a
          ><button class="return-notification" type="button" aria-label="通知">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"
              /></svg
            ><i aria-hidden="true"></i>
          </button>
        </header>
        <div class="return-content return-choice-content">
          <div class="return-heading">
            <h1>選擇還車拍攝方式</h1>
            <p>依現場空間選擇最適合的還車拍攝模式</p>
          </div>
          <div class="return-mode-list">
            <button class="return-mode-card" data-return-start type="button">
              <span
                class="return-mode-icon return-mode-icon--tight"
                aria-hidden="true"
                ><i></i><b></b
              ></span>
              <span class="return-mode-copy"
                ><strong>狹窄空間</strong><em>車位較窄，無法後退 2–3 公尺</em><i></i
                ><small>改用四角定點拍攝，<br />逐步完成外觀檢查</small></span
              >
              <span class="return-tight-art" aria-hidden="true"
                ><i></i><b></b><b></b
              ></span>
            </button>
            <button class="return-mode-card" data-return-start type="button">
              <span class="return-mode-icon return-mode-icon--open" aria-hidden="true"
                ><i></i><b></b
              ></span>
              <span class="return-mode-copy"
                ><strong>開闊空間</strong><em>車輛四周空曠，可完整環車</em><i></i
                ><small>使用 AI 引導環車錄影，<br />快速完成檢查</small></span
              >
              <span class="return-open-art" aria-hidden="true"><i></i><b></b></span>
            </button>
          </div>
          <button class="return-ai-recommendation" data-return-start type="button">
            <span>✦</span
            ><span
              ><strong>AI 推薦：</strong
              ><small>可先回答 3 個問題，系統會自動推薦模式</small></span
            ><b>›</b>
          </button>
          <button class="return-primary" data-return-start type="button">
            啟動還車時間
          </button>
        </div>
      </section>
    </template>
    <noscript>請啟用 JavaScript 以使用 iRent。</noscript>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
