<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜iRent</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body" data-initial-page="scan/start">
    <main data-app-loading role="status">頁面載入中…</main>
    <template data-page-content="scan/start">
      <section class="inspection-screen is-active" data-inspection-screen="start">
        <header class="inspection-topbar">
          <a class="inspection-wordmark" href="index.html" aria-label="iRent">iRent</a
          ><button class="inspection-notification" type="button" aria-label="通知">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"
              /></svg
            ><i aria-hidden="true"></i>
          </button>
        </header>
        <div class="inspection-heading">
          <h1 data-inspection-title>開始取車檢查</h1>
          <p data-inspection-subtitle>請依 AI 引導完成車外觀與內裝檢查</p>
        </div>
        <div class="inspection-start-cards">
          <article>
            <div>
              <span class="inspection-card-icon">▣</span
              ><strong>車外 AI 引導拍攝</strong><em>檢查車身外觀狀況</em>
              <p>依序拍攝四個角落後偵查車牌，確認車身是否有刮痕或損傷。</p>
            </div>
            <div class="inspection-illustration inspection-illustration--exterior">
              <div class="inspection-loop"></div>
              <div class="inspection-car">
                <i class="inspection-car__roof"></i
                ><i class="inspection-car__body"></i><b></b><b></b>
              </div>
            </div>
          </article>
          <article>
            <div>
              <span class="inspection-card-icon">♧</span
              ><strong>車內 AI 引導拍攝</strong><em>檢查內裝與隨身物品</em>
              <p>依序拍攝前座、後座、地板與後車廂，確認車內清潔與是否遺留物品。</p>
            </div>
            <div class="inspection-cabin-art"><i></i><b></b></div>
          </article>
        </div>
        <p class="inspection-section-label">請先選擇拍攝環境</p>
        <div class="inspection-mode-options">
          <button
            class="is-selected"
            data-inspection-mode="open"
            type="button"
            aria-pressed="true"
          >
            <span>✓</span><strong>A. 空曠空間</strong
            ><small>可 2–3 公尺環車錄影</small></button
          ><button data-inspection-mode="tight" type="button" aria-pressed="false">
            <span>○</span><strong>B. 狹窄空間</strong><small>改採四角定點拍攝</small>
          </button>
        </div>
        <section class="inspection-checkpoints">
          <strong>AI 檢查重點</strong>
          <div>
            <span>🚗<small>車身外觀</small></span
            ><span>♧<small>內裝清潔</small></span
            ><span>▣<small>遺留物品</small></span
            ><span>ABC-1234<small>車牌比對</small></span>
          </div>
          <p>
            當車外照片中的車牌清晰可見時，系統將自動與本次訂單車牌比對，請清晰且充分拍攝。
          </p>
        </section>
        <button class="inspection-primary" data-scan-start type="button">
          <span>⌗</span>開始檢查
        </button>
      </section>
    </template>
    <noscript>請啟用 JavaScript 以使用 iRent。</noscript>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
