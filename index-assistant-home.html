<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜AI助手首頁</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body" data-initial-page="assistant/home">
    <main data-app-loading role="status">頁面載入中…</main>
    <template data-page-content="assistant/home">
      <section
        class="assistant-screen is-active"
        data-assistant-screen="home"
        aria-label="AI助手首頁"
      >
        <header class="assistant-topbar">
          <a class="assistant-wordmark" href="index.html" aria-label="iRent">iRent</a>
        </header>
        <div class="assistant-content">
          <div class="assistant-subbar">
            <button
              class="assistant-back"
              data-assistant-home
              type="button"
              aria-label="返回首頁"
            >
              ‹
            </button>
            <h1>iRent 智慧客服</h1>
            <button class="assistant-history" type="button">
              ◷ <span>服務紀錄</span>
            </button>
          </div>
          <div class="assistant-hero">
            <div class="assistant-robot" aria-hidden="true">
              <i></i><b></b><span>⌣</span>
            </div>
            <div class="assistant-welcome">
              <strong>哈囉！我是 iRent 智慧客服</strong>
              <p>有任何租車相關的問題，<br />我都可以協助您喔！</p>
            </div>
          </div>
          <div class="assistant-feature-grid">
            <button data-assistant-case type="button">
              <span class="assistant-feature-icon assistant-feature-icon--teach"
                >◆</span
              ><strong>租借教學</strong><small>如何預約與用車</small><b>›</b></button
            ><button data-assistant-case type="button">
              <span class="assistant-feature-icon assistant-feature-icon--alert"
                >!</span
              ><strong>異常回報</strong><small>車輛問題回報</small><b>›</b></button
            ><button data-nav-view="feedback" type="button">
              <span class="assistant-feature-icon assistant-feature-icon--clean"
                >▣</span
              ><strong>清潔回報</strong><small>車廂清潔問題</small><b>›</b></button
            ><button data-assistant-case type="button">
              <span class="assistant-feature-icon assistant-feature-icon--faq">?</span
              ><strong>常見問題</strong><small>熱門問題總覽</small><b>›</b>
            </button>
          </div>
          <h2 class="assistant-question-title">猜你想問</h2>
          <div class="assistant-question-list">
            <button data-assistant-prompt="無法解鎖怎麼辦？" type="button">
              無法解鎖怎麼辦？　›</button
            ><button data-assistant-prompt="發現刮痕如何處理？" type="button">
              發現刮痕如何處理？　›</button
            ><button data-assistant-prompt="如何延長租借時間？" type="button">
              如何延長租借時間？　›
            </button>
          </div>
          <div class="assistant-composer">
            <span>●</span
            ><input
              type="text"
              placeholder="請輸入您的問題…"
              aria-label="輸入問題"
            /><button type="button">➤</button><small>服務時間：24 小時全年無休</small>
          </div>
        </div>
      </section>
    </template>
    <noscript>請啟用 JavaScript 以使用 iRent。</noscript>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
