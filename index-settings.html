<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜設定</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body" data-initial-page="settings">
    <main data-app-loading role="status">頁面載入中…</main>
    <template data-page-content="settings">
      <section class="feature-view" data-view-panel="settings" aria-label="設定">
        <header class="feature-view__header">
          <span>設定</span><strong>帳戶與偏好</strong>
        </header>
        <button
          class="profile-card"
          data-login-open
          type="button"
          aria-haspopup="dialog"
        >
          <span data-profile-initials>訪</span>
          <div>
            <strong data-profile-name>登入會員</strong
            ><small data-profile-status>登入後查看會員資料</small>
          </div>
          <b>›</b>
        </button>
        <div class="settings-list">
          <button type="button"><span>付款方式</span><b>›</b></button
          ><button type="button"><span>通知設定</span><b>›</b></button
          ><button type="button"><span>隱私權與安全</span><b>›</b></button
          ><button type="button"><span>關於 iRent</span><b>›</b></button>
        </div>
      </section>
    </template>
    <noscript>請啟用 JavaScript 以使用 iRent。</noscript>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
