<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜返回車內拍攝</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body" data-initial-page="scan/cabin-normal">
    <main data-app-loading role="status">頁面載入中…</main>
    <template data-page-content="scan/cabin-normal">
      <section
        class="inspection-screen cabin-result-screen return-cabin-result-screen"
        data-inspection-screen="cabin-normal"
      >
        <header class="inspection-topbar">
          <button
            class="inspection-back"
            data-inspection-back
            type="button"
            aria-label="返回車內拍攝"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m15 5-7 7 7 7" />
            </svg></button
          ><a class="inspection-wordmark" href="index.html" aria-label="iRent"
            >iRent</a
          ><button class="inspection-help" type="button" aria-label="說明">?</button>
        </header>
        <div class="inspection-heading"><h1>AI 車內清潔檢測結果</h1></div>
        <div class="cabin-status-banner cabin-status-banner--normal">
          <span>!</span>
          <div>
            <strong>車內狀況　普通</strong>
            <p>有可自行清理的大型垃圾，建議清理後再還車</p>
          </div>
        </div>
        <div class="cabin-result-photo cabin-result-photo--normal">
          <i></i><b></b>
        </div>
        <section class="cabin-summary">
          <h2>▤　車內檢測狀況摘要</h2>
          <div class="cabin-score-row">
            <div class="cabin-score cabin-score--normal">
              <strong>78</strong><small>/100</small>
            </div>
            <div>
              <span>車內清潔度分類</span><strong>●　尚可</strong>
              <p>車內有大型垃圾，建議清理後重新評分，再完成還車。</p>
            </div>
          </div>
          <div class="cabin-check-list">
            <p>♟　座椅 <em>良好</em><small>⌄</small></p>
            <p>▰　地板 <em>良好</em><small>⌄</small></p>
            <p>▱　中控/儀錶板 <em>良好</em><small>⌄</small></p>
            <p>
              ▣　門板/置物空間 <em>大型垃圾 1 項</em><b>待清理</b><small>⌄</small>
            </p>
            <p>▣　後車廂 <em>良好</em><small>⌄</small></p>
            <p>♨　異味檢測 <em>良好</em><small>⌄</small></p>
          </div>
        </section>
        <section class="cabin-trash-card cabin-trash-card--normal">
          <strong
            >可自行清潔的大型垃圾 <small>共 1 項（每項記錄 1 點）</small></strong
          >
          <div class="cabin-trash-item">
            <i></i><span><b>塑膠袋</b><small>後座地板</small></span>
          </div>
        </section>
        <section class="cabin-action-grid">
          <article>
            <span>★</span><strong>預估處理方式</strong><b>可自行清理</b
            ><small>無需送洗</small>
          </article>
          <article>
            <span>$</span><strong>預估清潔費用</strong><b>$0</b
            ><small>（含稅）</small>
          </article>
          <article>
            <span>!</span><strong>預計記入違規點數</strong><b>1 <small>點</small></b
            ><small>大型垃圾 1 項</small>
          </article>
        </section>
        <button class="cabin-secondary-action" data-cabin-recheck type="button">
          自主清潔後重新評分</button
        ><button
          class="inspection-primary cabin-finish-button"
          data-cabin-return-submit
          type="button"
        >
          選擇還車
        </button>
      </section>
    </template>
    <noscript>請啟用 JavaScript 以使用 iRent。</noscript>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
