<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜返回檢查首頁</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body" data-initial-page="scan/cabin-capture">
    <main data-app-loading role="status">頁面載入中…</main>
    <template data-page-content="scan/cabin-capture">
      <section
        class="inspection-screen return-cabin-capture-screen"
        data-inspection-screen="cabin-capture"
      >
        <header class="inspection-topbar">
          <button
            class="inspection-back"
            data-inspection-back
            type="button"
            aria-label="返回檢查首頁"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m15 5-7 7 7 7" />
            </svg></button
          ><a class="inspection-wordmark" href="index.html" aria-label="iRent"
            >iRent</a
          ><button class="inspection-notification" type="button" aria-label="通知">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"
              /></svg
            ><i aria-hidden="true"></i>
          </button>
        </header>
        <div class="inspection-heading return-cabin-heading">
          <h1>AI 引導車內拍攝</h1>
        </div>
        <div class="inspection-mode-banner">
          <span>♧</span>
          <div>
            <strong>車內模式</strong><small>請依序拍攝前座、後座、地板與後車廂</small>
          </div>
        </div>
        <div class="cabin-camera">
          <div class="cabin-interior-art"><i></i><b></b><span></span></div>
          <div class="inspection-frame"></div>
          <div class="cabin-capture-badge"><strong>2/4</strong><span>後座</span></div>
          <div class="cabin-camera-tip">●　請拍攝後座椅面與靠背，確保無遺留物品</div>
        </div>
        <div class="inspection-thumbnails cabin-thumbnails">
          <span><b>1</b><i></i><small>前座</small></span
          ><span class="is-current"><b>2</b><i></i><small>後座</small></span
          ><span><b>3</b><i></i><small>地板</small></span
          ><span><b>4</b><i></i><small>後車廂</small></span>
        </div>
        <div class="inspection-validation">
          <span
            >✓<small>車內清楚<br />AI 辨識通過</small></span
          ><span
            >✓<small>範圍完整<br />AI 檢測通過</small></span
          ><span
            >☼<small>光線正常<br />AI 檢測通過</small></span
          >
        </div>
        <div class="inspection-camera-controls inspection-camera-controls--capture">
          <button type="button">
            ▣<small>僅限現場拍攝<br />請勿上傳相簿</small></button
          ><button
            class="inspection-shutter inspection-shutter--teal"
            data-cabin-capture-next
            type="button"
            aria-label="完成車內拍攝"
          ></button
          ><button type="button">♧<small>拍攝提示</small></button>
        </div>
      </section>
    </template>
    <noscript>請啟用 JavaScript 以使用 iRent。</noscript>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
