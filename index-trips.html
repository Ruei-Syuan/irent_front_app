<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜租借歷史</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body" data-initial-page="trips">
    <main data-app-loading role="status">頁面載入中…</main>
    <template data-page-content="trips">
      <section
        class="feature-view history-view"
        data-view-panel="trips"
        aria-label="租借歷史"
      >
        <header class="feature-view__header">
          <span>租借歷史</span><strong>查看你的租借紀錄</strong>
        </header>
        <form class="history-filters" data-history-filters>
          <div class="history-filter-heading">
            <strong>篩選租借紀錄</strong
            ><button data-history-reset type="reset">清除條件</button>
          </div>
          <div class="history-filter-dates">
            <label>開始日期<input data-history-start type="date" /></label>
            <span aria-hidden="true">至</span>
            <label>結束日期<input data-history-end type="date" /></label>
          </div>
          <label class="history-filter-field"
            >租借站點<select data-history-station>
              <option value="">全部站點</option>
              <option>台北車站東停車場</option>
              <option>市民大道停車場</option>
              <option>忠孝敦化站</option>
              <option>大安站</option>
            </select></label
          >
          <label class="history-filter-field"
            >搜尋車輛或車牌<input
              data-history-keyword
              type="search"
              placeholder="例如 Toyota、ABC-1234"
          /></label>
        </form>
        <div class="history-result-heading">
          <strong data-history-result-count>共 4 筆租借紀錄</strong
          ><span>依開始時間排序</span>
        </div>
        <div class="history-record-list" data-history-record-list></div>
      </section>
    </template>
    <noscript>請啟用 JavaScript 以使用 iRent。</noscript>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
