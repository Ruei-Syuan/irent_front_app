<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜附近車輛</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body">
    <!-- App 主容器：所有主要頁面都以 data-view-panel 切換顯示。 -->
    <main class="nearby-app" aria-label="iRent 附近車輛">
      <!-- 共用上方 Bar：由 JavaScript 依目前頁面更新標題與返回目的地。 -->
      <header class="app-header is-home" data-app-header>
        <button
          class="app-header__menu"
          data-menu-toggle
          type="button"
          aria-label="開啟功能選單"
          aria-expanded="false"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <a class="app-header__wordmark" href="index.html" aria-label="iRent"
          >iRent</a
        >
        <strong class="app-header__title" data-header-title></strong>
        <button
          class="notification-button app-header__notification"
          type="button"
          aria-label="通知"
          aria-expanded="false"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
          </svg>
          <i aria-hidden="true"></i>
        </button>
        <!-- 右上角會員功能：登入後顯示會員姓名，展開後可登出。 -->
        <div class="member-menu" data-member-menu>
          <button
            class="member-menu__trigger"
            data-member-menu-toggle
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span
              class="member-menu__avatar"
              data-member-initials
              aria-hidden="true"
              >-</span
            >
            <span class="member-menu__copy"
              ><strong data-member-name>登入會員</strong
              ><small data-member-status>尚未登入</small></span
            >
            <svg
              class="member-menu__chevron"
              aria-hidden="true"
              viewBox="0 0 24 24"
            >
              <path d="m7 9 5 5 5-5" />
            </svg>
          </button>
          <div class="member-menu__panel" data-member-panel role="menu" hidden>
            <button type="button" data-member-login role="menuitem">
              登入會員
            </button>
            <button type="button" data-member-logout role="menuitem" hidden>
              登出
            </button>
          </div>
        </div>
      </header>

      <!-- 浮動 AI 客服：固定在右下角，點擊後開啟 AI 助手頁面。 -->
      <button
        class="floating-assistant"
        data-floating-assistant
        type="button"
        aria-label="開啟 AI 助手"
      >
        <span class="floating-assistant__avatar" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M24 8v4M20 8h8" />
            <rect
              x="7"
              y="12"
              width="34"
              height="25"
              rx="11"
              fill="#071b38"
              stroke="#fff"
              stroke-width="2"
            />
            <circle cx="18" cy="24" r="2.7" fill="#08cabb" />
            <circle cx="30" cy="24" r="2.7" fill="#08cabb" />
            <path d="M19 31h10" stroke="#08cabb" stroke-width="2" />
          </svg>
        </span>
        <small>AI 助手</small>
      </button>

      <!-- 首頁：地圖、搜尋與定位功能。 -->
      <template data-page-slot="nearby"></template>

      <!-- 首頁：附近推薦車輛清單與車輛狀況入口。 -->

      <!-- 車輛詳情：顯示車況、位置、租金與預約入口。 -->
      <template data-page-slot="vehicle"></template>

      <!-- 訂單流程：確認預約內容與送出訂單。 -->
      <template data-page-slot="order-confirm"></template>

      <!-- 訂單詳情：顯示目前預約的時間、車輛與取車資訊。 -->
      <template data-page-slot="order-detail"></template>

      <!-- AI 取車檢查：開始、錄影、拍照、結果與車內檢測流程。 -->
      <template data-page-slot="scan"></template>

      <!-- 租借流程：確認 AI 車況後開始租借。 -->
      <template data-page-slot="rental-ready"></template>

      <!-- 租借中：顯示剩餘時間、費用與車況紀錄。 -->
      <template data-page-slot="renting"></template>

      <!-- 還車流程：選擇還車方式、拍攝車況並提交。 -->
      <template data-page-slot="return"></template>

      <!-- 還車摘要：整理車外、車內檢查結果與預估費用。 -->
      <template data-page-slot="return-summary"></template>

      <!-- 還車完成：顯示費用、客服通知與最終狀態。 -->
      <template data-page-slot="return-complete"></template>

      <!-- 異常回饋：讓使用者回報車輛清潔、外觀或設備問題。 -->
      <template data-page-slot="feedback"></template>

      <!-- AI 助手：提供常見問題、異常處理與客服轉接入口。 -->
      <template data-page-slot="assistant"></template>

      <!-- 租借歷史：依日期、站點與關鍵字篩選過去租借紀錄。 -->
      <template data-page-slot="trips"></template>

      <!-- 點數紀錄：顯示目前點數、過去違規與獲得點數紀錄。 -->
      <template data-page-slot="points"></template>

      <!-- 客服中心：提供常見租車問題與線上客服入口。 -->
      <template data-page-slot="support"></template>

      <!-- 設定：管理會員資料、付款、通知與隱私設定。 -->
      <template data-page-slot="settings"></template>

      <!-- 底部導覽：切換找車、租借歷史、開門、點數紀錄與我的頁面。 -->
      <nav class="app-nav" aria-label="App 導覽">
        <!-- <button class="is-active" data-nav-view="nearby" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-12a7 7 0 1 0-14 0c0 6.5 7 12 7 12Z" /><circle cx="12" cy="9" r="2" /></svg><span>找車(主畫面)</span></button> -->
        <button data-nav-view="trips" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="5" y="4" width="14" height="17" rx="2" />
            <path d="M8 2v4M16 2v4M5 9h14" /></svg
          ><span>租借歷史</span>
        </button>
        <button class="take-car" data-nav-view="scan" type="button">
          <span
            ><svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M7 3h10M7 21h10M5 6h14v12H5zM9 9h6v6H9z" /></svg></span
          ><small>開門</small>
        </button>
        <button data-nav-view="points" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M12 3 14.8 9l6.2.6-4.7 4.1 1.4 6.1-5.7-3.2-5.7 3.2 1.4-6.1L3 9.6 9.2 9 12 3Z"
            /></svg
          ><span>點數紀錄</span>
        </button>
        <button data-nav-view="settings" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M5 21c.4-4 2.7-6 7-6s6.6 2 7 6" /></svg
          ><span>帳號設定</span>
        </button>
      </nav>
    </main>

    <!-- 側邊功能選單：由 JavaScript 控制開啟、關閉與頁面切換。 -->
    <button
      class="menu-backdrop"
      data-menu-close
      type="button"
      aria-label="關閉功能選單"
    ></button>
    <aside
      class="function-menu"
      data-function-menu
      aria-hidden="true"
      aria-label="功能選單"
    >
      <div class="function-menu__header">
        <strong>功能選單</strong>
        <button
          class="icon-button"
          data-menu-close
          type="button"
          aria-label="關閉功能選單"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <nav class="function-menu__nav" aria-label="主要功能">
        <button
          class="is-active"
          data-menu-action
          data-view="nearby"
          type="button"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 21s7-5.5 7-12a7 7 0 1 0-14 0c0 6.5 7 12 7 12Z" />
            <circle cx="12" cy="9" r="2" /></svg
          >找車
        </button>
        <button
          data-menu-action
          data-pickup-menu
          data-view="order-detail"
          type="button"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 9h14v9H5zM7 9l2-4h6l2 4M8 18h.01M16 18h.01" /></svg
          >&#21462;&#36554;
        </button>
        <button data-menu-action data-view="return" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 4h14v16H5zM8 8h8M8 12h5" /></svg
          >還車
        </button>
        <button data-menu-action data-view="trips" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="5" y="4" width="14" height="17" rx="2" />
            <path d="M8 2v4M16 2v4M5 9h14" /></svg
          >租借歷史
        </button>
        <!-- <button data-menu-action data-view="feedback" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 3 20h18L12 3Z" /><path d="M12 9v4M12 17h.01" /></svg>異常回饋</button> -->
        <button data-menu-action data-view="points" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M12 3 14.8 9l6.2.6-4.7 4.1 1.4 6.1-5.7-3.2-5.7 3.2 1.4-6.1L3 9.6 9.2 9 12 3Z"
            /></svg
          >點數紀錄
        </button>
        <button data-menu-action data-view="settings" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M5 21c.4-4 2.7-6 7-6s6.6 2 7 6" /></svg
          >帳戶偏好
        </button>
      </nav>
      <!-- <div class="function-menu__footer">iRent 前端預覽</div> -->
    </aside>

    <!-- 登入視窗：送出一般會員 API，成功後由 HttpOnly Cookie 維持登入。 -->
    <section
      class="login-modal"
      data-login-modal
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="login-title"
    >
      <div class="login-modal__card">
        <div class="login-modal__header">
          <div>
            <span>iRent</span>
            <h2 id="login-title">登入會員</h2>
          </div>
          <button
            class="login-modal__close"
            data-login-close
            type="button"
            aria-label="關閉登入視窗"
          >
            ×
          </button>
        </div>
        <p class="login-modal__intro">登入後即可查看點數紀錄與會員資訊。</p>
        <form class="login-form" data-login-form>
          <label
            >帳號或手機<input
              data-login-account
              name="account"
              type="text"
              autocomplete="username"
              placeholder="請輸入帳號或手機號碼"
              required
          /></label>
          <label
            >密碼
            <span class="login-password-field">
              <input
                data-login-password
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="請輸入密碼"
                minlength="8"
                required
              />
              <button
                class="login-password-toggle"
                data-login-password-toggle
                type="button"
                aria-label="顯示密碼"
                aria-pressed="false"
              >
                顯示
              </button>
            </span>
          </label>
          <p
            class="login-form__error"
            data-login-error
            role="alert"
            aria-live="polite"
          ></p>
          <button class="login-form__submit" type="submit">登入</button>
          <button
            class="login-form__logout"
            data-login-logout
            type="button"
            hidden
          >
            登出目前帳號
          </button>
        </form>
      </div>
    </section>

    <!-- 通知中心：由右上角鈴鐺開啟，顯示提醒並可一次標記為已讀。 -->
    <aside
      class="notification-panel"
      data-notification-panel
      aria-hidden="true"
      aria-label="通知中心"
    >
      <div class="notification-panel__header">
        <strong>通知</strong>
        <button
          class="notification-panel__close"
          data-notification-close
          type="button"
          aria-label="關閉通知"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="notification-list">
        <article class="notification-item is-unread">
          <span class="notification-item__icon">⌁</span>
          <div>
            <strong>取車提醒</strong>
            <p>您的 Toyota Yaris 預約即將開始，請準備前往取車。</p>
            <small>剛剛</small>
          </div>
        </article>
        <article class="notification-item is-unread">
          <span class="notification-item__icon">✓</span>
          <div>
            <strong>AI 車況檢查完成</strong>
            <p>車輛已完成檢查，目前車況符合租借標準。</p>
            <small>10 分鐘前</small>
          </div>
        </article>
        <article class="notification-item">
          <span class="notification-item__icon">i</span>
          <div>
            <strong>服務公告</strong>
            <p>請於還車後完成車外與車內照片拍攝。</p>
            <small>昨天</small>
          </div>
        </article>
      </div>
      <button
        class="notification-panel__mark-read"
        data-notification-mark-read
        type="button"
      >
        全部標記為已讀
      </button>
    </aside>

    <!-- 先載入 MapLibre，再載入網站互動邏輯，確保手機瀏覽器可取得全域 maplibregl。 -->
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
    <div
      class="app-toast"
      data-app-toast
      role="status"
      aria-live="polite"
    ></div>
  </body>
</html>
