<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 網頁基本設定：使用繁體中文、手機版視窗與品牌主題色。 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a79b" />
    <title>iRent｜取車前車況確認</title>
    <!-- 載入 MapLibre 地圖元件與本網站主要樣式。 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="css/nearby-vehicles.css" />
  </head>
  <body class="front-app-body" data-initial-page="rental-ready">
    <main data-app-loading role="status">頁面載入中…</main>
    <template data-page-content="rental-ready">
      <section
        class="feature-view rental-flow-view"
        data-view-panel="rental-ready"
        aria-label="取車前車況確認"
      >
        <header class="rental-topbar">
          <a class="rental-wordmark" href="index.html" aria-label="iRent">iRent</a>
        </header>
        <div class="rental-content">
          <div class="rental-heading">
            <h1>取車前車況確認</h1>
            <p>請確認車內外狀況後再開始租車</p>
          </div>
          <article class="rental-vehicle-card">
            <div>
              <strong>ABC-1234</strong><small>iRent GO / Toyota Yaris</small
              ><span>⌾　忠孝復興站</span>
            </div>
            <div class="rental-car-visual">
              <div class="inspection-car inspection-car--rental">
                <i class="inspection-car__roof"></i
                ><i class="inspection-car__body"></i><b></b><b></b>
              </div>
            </div>
          </article>
          <section class="rental-summary">
            <h2>本次車況摘要</h2>
            <div class="rental-summary-grid">
              <article>
                <span>▱</span>
                <div>
                  <strong>車外狀況 <em>合格</em></strong>
                  <p>既有車損 3 處，<br />已完成歷史比對</p>
                </div>
              </article>
              <article>
                <span>♧</span>
                <div>
                  <strong>車內狀況 <em>合格</em></strong>
                  <p>整潔分數 94 / 100，<br />判定乾淨</p>
                </div>
              </article>
            </div>
            <p class="rental-success">✓　AI 已完成取車前檢查，車況符合租借標準</p>
          </section>
          <section class="rental-alternatives">
            <h2>若不想租這台車</h2>
            <button data-nav-view="nearby" type="button">取消借車</button
            ><small>取消後可改租附近車輛</small>
            <div>
              <strong>附近仍可租借且車況合格</strong>
              <p>🚗　DEF-5678　| 忠孝敦化　| 180m　<b>車況合格</b>　›</p>
              <p>🚗　GHI-9012　| 大安站　| 260m　<b>車況合格</b>　›</p>
              <p>🚗　JKL-3456　| 南京復興站　| 320m　<b>車況合格</b>　›</p>
            </div>
          </section>
          <button class="rental-primary" data-rental-start type="button">
            <span>▣</span>確認借車
          </button>
        </div>
      </section>
    </template>
    <noscript>請啟用 JavaScript 以使用 iRent。</noscript>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
